services:
  - type: web
    name: monthly-report
    runtime: node
    repo: https://github.com/jintly2/monthly-report-system
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: monthly-report-db
          property: connectionString

databases:
  - name: monthly-report-db
    plan: free
    region: oregon
    databaseName: monthly_report
    user: report_user
